
collections:
  - name: authors
    label: Authors
    label_singular: Author
    folder: content/authors
    create: true
    extension: yml
    format: yaml
    slug: "{{slug}}"
    identifier_field: name

    fields:
      - name: name
        label: Author Name
        widget: string
        required: true

      - name: bio
        label: Biography
        widget: text
        required: false

      - name: photo
        label: Author Photo
        widget: image
        required: false

      - name: website
        label: Website
        widget: string
        required: false

